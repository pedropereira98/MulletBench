- name: Install database for all hosts
  hosts:
    - edgeservers
    - cloudservers
  roles:
    - common-database

- name: Config cloud servers
  hosts: cloudservers
  roles:
    - clouds
  tags:
    - config

- name: Config edge servers
  hosts: edgeservers
  roles:
    - edges
  tags:
    - config

- name: Run Benchmark Orchestrator
  hosts: localhost
  connection: local
  roles:
    - benchmark-orchestrator

- name: Run Benchmark Clients
  hosts: benchmark_clients
  roles:
    - benchmark-client
