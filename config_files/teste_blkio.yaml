# This file provides an example configuration for the testing phase of a query test with a single cloud server.
all:
  vars:
    database: influx #influx or iotdb

    dataset: GPSMPU # Accel or GPSMPU
    current_time: true
    shared_dataset: true
    shared_connection: false

    influx_username: influx
    influx_password: influxpw
    influx_org: myorg
    influx_bucket: mybucket
    influx_token: mytoken
    influx_port: 8086
    influx_version: 2.7

    benchmark_client_version: v1.0
    benchmark_orchestrator_version: v1.0

    final_monitoring_period_sec: 60

    monitoring_interval: 2sec

    ansible_connection: ssh
    ansible_user: gsd

    home_dir: /home
    blkio_path: /dev/sda #required for blkio_config (io or bps limiting)

edgeservers:
  hosts:
    edge1:
      ansible_host: 192.168.112.89
      ansible_connection: ssh
      ansible_user: gsd

      limited_resources: true
      use_resource_profile: false
      limited_resources_cpu: 4
      limited_resources_mem: 1024 # in MB
      limited_resources_read_bps: "100mb" #Pi 3 B+ with SD card
      limited_resources_write_bps: "80mb" #Pi 3 B+ with SD card
      limited_resources_read_iops: 2700 # 4k read with SD card
      limited_resources_write_iops: 1200 # 4k write with SD card
      monitor: true

cloudservers:
benchmark_clients:
  hosts:
    client1:
      stage: 1
      ansible_host: 192.168.112.87
      ansible_connection: ssh
      ansible_user: gsd

      
      target: edge1

      data_file: dataset_gps_mpu_left.csv
      num_workers: 100
      type: INSERT

      insert_volume: 184000
      batch_size: 100
      insert_rate: 100
      monitor: true

    # client11:
    #   stage: 1
    #   ansible_host: 192.168.112.90
    #   ansible_connection: ssh
    #   ansible_user: gsd

      
    #   target: edge1

    #   data_file: dataset_gps_mpu_left.csv
    #   num_workers: 50
    #   type: INSERT

    #   insert_volume: 184000
    #   batch_size: 100
    #   insert_rate: 100
    #   monitor: true

    client2:
      stage: 2
      ansible_host: 192.168.112.90
      monitor: true

      target: edge1

      data_file: dataset_gps_mpu_left.csv
      num_workers: 2
      type: QUERY
      
      query_count: 240 # total number of queries submitted per worker
      query_rate: 1 # number of queries per second per worker
      agg_weight: 40 # weight of aggregation queries
      filter_weight: 0 # weight of filter queries
      downsample_weight: 20 # weight of downsample queries
      outlier_filter_weight: 40 # weight of outlier filter queries
      count_outlier_filter: false
      filter_z_score: 4.0
    
    # client22:
    #   stage: 2
    #   ansible_host: 192.168.112.87
    #   monitor: true

    #   target: edge1

    #   data_file: dataset_gps_mpu_left.csv
    #   num_workers: 2
    #   type: QUERY
      
    #   query_count: 1120 # total number of queries submitted per worker
    #   query_rate: 10 # number of queries per second per worker
    #   agg_weight: 40 # weight of aggregation queries
    #   filter_weight: 0 # weight of filter queries
    #   downsample_weight: 20 # weight of downsample queries
    #   outlier_filter_weight: 40 # weight of outlier filter queries
    #   count_outlier_filter: false
    #   filter_z_score: 4.0

  vars:
    max_memory: 4G # max heap memory for the JVM for each client instance
    fjp_parallelism: 100

    orchestrator_ip: 10.100.100.190
    read_timeout: 60
