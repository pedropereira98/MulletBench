all:
  vars:
    database: influx #influx or iotdb

    dataset: GPSMPU # Accel or GPSMPU
    current_time: false
    shared_dataset: true
    shared_connection: false

    # iotdb_device_path: "root.gps.mpu.*"
    # iotdb_version: "1.3.3"   
    # align_by_device: true

    influx_username: influx
    influx_password: influxpw
    influx_org: myorg
    influx_bucket: mybucket
    influx_token: mytoken
    influx_port: 8086
    influx_version: 2.7

    benchmark_client_version: latest
    benchmark_orchestrator_version: latest

    monitoring_interval: 2sec

    ansible_connection: ssh
    ansible_user: tbag
    ansible_password: Guimaraes1

    home_dir: /home
    blkio_path: /dev/sda #required for blkio_config (io or bps limiting)
    
edgeservers:
  hosts:
    edge1:
      ansible_host: 192.168.112.89
      ansible_user: gsd

      ansible_connection: ssh

      # ansible_host: 192.168.115.218
      # ansible_user: joaonovais
      # ansible_password: Guimaraes1
      # ansible_become_password: Guimaraes1
      # ansible_distribution: Ubuntu
      # ansible_distribution_version: 22.04

      limited_resources: true
      use_resource_profile: false
      #   limited_profile: rpi3
      limited_resources_cpu: 0.51575
      limited_resources_mem: 512 # in MB
      limited_resources_read_bps: 22M #Pi 3 B+ with SD card
      limited_resources_write_bps: 16M #Pi 3 B+ with SD card
      limited_resources_read_iops: 2700 # 4k read with SD card
      limited_resources_write_iops: 1200 # 4k write with SD card
      monitor: true

cloudservers:
benchmark_clients:
  hosts:
    client1:
      stage: 1
      ansible_user: gsd
      ansible_host: 192.168.112.87

      ansible_connection: ssh

      target: edge1

      # data_file: data_1600_accel_watch.txt
      data_file: dataset_gps_mpu_left.csv
      num_workers: 8
      type: INSERT

      insert_volume: 144000 # total number of inserted points per worker
      batch_size: 100 # number of points per batch
      insert_rate: 30  # number of inserted batches per second per worker
      monitor: true

    client11:
      stage: 1
      ansible_user: gsd
      ansible_host: 192.168.112.90
      
      ansible_connection: ssh

      target: edge1

      # data_file: data_1600_accel_watch.txt
      data_file: dataset_gps_mpu_left.csv
      num_workers: 8
      type: INSERT

      insert_volume: 144000 # total number of inserted points per worker
      batch_size: 100 # number of points per batch
      insert_rate: 30 # number of inserted batches per second per worker
      monitor: true

  vars:
    max_memory: 4G # max heap memory for the JVM for each client instance
    fjp_parallelism: 60
    orchestrator_ip: 192.168.115.249
    read_timeout: 60
    write_timeout: 60
