# This file provides an example configuration for the testing phase of a query test with a single cloud server.
all:
  vars:
    database: iotdb #influx or iotdb

    dataset: GPSMPU # Accel or GPSMPU
    current_time: false
    shared_dataset: true
    shared_connection: false

    iotdb_device_path: "root.gps.mpu.*"
    iotdb_version: "1.1.1"
    align_by_device: true

    # influx_username: influx
    #influx_password: influxpw
    #influx_org: myorg
    #influx_bucket: mybucket
    #influx_token: mytoken
    #influx_port: 8086
    #influx_version: 2.7

    benchmark_client_version: latest
    benchmark_orchestrator_version: latest

    monitoring_interval: 2sec

    final_monitoring_period_sec: 0

    ansible_connection: ssh
    ansible_user: tbag
    ansible_password: Guimaraes1

    home_dir: /home
    blkio_path: /dev/sda #required for blkio_config (io or bps limiting)

edgeservers:
  hosts:
    edge1:
      ansible_host: 192.168.112.142
      ansible_user: gsd

      ansible_connection: ssh

      # ansible_host: 192.168.115.238
      # ansible_user: joaonovais
      # ansible_password: Guimaraes1
      # ansible_become_password: Guimaraes1
      # ansible_distribution: Ubuntu
      # ansible_distribution_version: 22.04

      limited_resources: true
      use_resource_profile: false
        # limited_profile: rpi3
      limited_resources_cpu: 4
      limited_resources_mem: 1024 # in MB
      #      limited_resources_read_bps: 22.8M #Pi 3 B+ with SD card
      #      limited_resources_write_bps: 17.6M #Pi 3 B+ with SD card
      # limited_resources_read_iops: 2700 # 4k read with SD card
      # limited_resources_write_iops: 1200 # 4k write with SD card
      monitor: true

cloudservers:
benchmark_clients:
