      ansible_host: 192.168.112.87
      ansible_user: gsd

      # ansible_host: 192.168.1.112
      # ansible_user: core
      # ansible_port: 3022
      # ansible_password: core
      # ansible_become_password: core

      ansible_connection: ssh

      target: edge1

      data_file: dataset_gps_mpu_left.csv
      num_workers: 20
      type: INSERT

      insert_volume: 80000
      batch_size: 100
      insert_rate: 100
      monitor: true

